name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r booking-service/requirements.txt flake8
      - name: Lint
        run: flake8 booking-service/app payment-service --max-line-length=120
      - name: Run tests
        working-directory: booking-service
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
